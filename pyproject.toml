[project]
name = "subtitle-cue-guard-dev"
version = "0.1.1"
description = "Development environment for the subtitle-cue-guard agent skill (tests only; the skill script has no dependencies)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
