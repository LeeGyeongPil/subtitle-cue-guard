[project]
name = "subtitle-cue-guard-dev"
version = "0.1.3"
description = "Development environment for the subtitle-cue-guard agent skill (tests only; the skill script has no dependencies)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 한 테스트가 120초를 넘기면 모든 스레드의 스택을 출력한다 — CI 에서 멈춘 곳을 로그로 남긴다
faulthandler_timeout = 120
