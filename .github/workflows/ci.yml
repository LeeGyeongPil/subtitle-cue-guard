# Minimal CI for the agent skill: one job, two official actions, pytest from pip.
# No model calls. The measured evals run before release and are recorded in the README.
# The Agent Skills frontmatter rules are mirrored offline in tests/test_ci_robustness.py.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Every command step has its own time limit, so a stall ends at that step with a log
      # instead of at the job limit with none.
      - name: diagnostics (versions, encodings, fixture line endings)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python --version
          git --version
          git ls-files --eol -- tests/fixtures/bom_crlf.srt evals/fixtures/task-vtt-bytes/rich.vtt
          git check-attr text -- tests/fixtures/bom_crlf.srt evals/fixtures/task-vtt-bytes/rich.vtt
          head -c 8 tests/fixtures/bom_crlf.srt | od -An -c
          python -c "import sys, locale, unicodedata; print('unicodedata', unicodedata.unidata_version); print('preferred encoding', locale.getpreferredencoding(False), 'utf8_mode', sys.flags.utf8_mode, 'stdout', sys.stdout.encoding)"
      - name: install pytest
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: "pytest==9.2.0"
          python -m pip list
      - name: tests
        timeout-minutes: 5
        run: python -m pytest -rA --tb=short </dev/null
      - name: the bundled script answers --help
        timeout-minutes: 3
        run: python skills/subtitle-cue-guard/scripts/cue_guard.py --help > /dev/null </dev/null
